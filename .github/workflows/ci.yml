name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  client-checks:
    name: Client (type-check, lint, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm vitest --run

  db-checks:
    name: Database (migrations lint + type regen + RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local stack
        run: supabase start

      - name: Apply migrations + seed
        run: supabase db reset

      - name: Lint migrations
        run: supabase db lint

      - name: Regenerate TypeScript types
        run: |
          supabase gen types typescript --local > client/src/types/database.ts.gen
          if ! diff -u client/src/types/database.ts client/src/types/database.ts.gen; then
            echo "::error::Type drift detected. Run 'scripts/regen-types.sh' and commit the updated client/src/types/database.ts"
            exit 1
          fi
          rm client/src/types/database.ts.gen

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install client deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Run RLS integration tests
        working-directory: client
        run: SUPABASE_DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres pnpm test:rls

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
