# ====================================================================
# SupaNext Supabase config — COMMITTED TEMPLATE
# ====================================================================
# Only this sample is tracked in git. Per-environment files are local:
#
#   config.local.toml  your local dev overrides (optional)
#   config.prod.toml   production settings (never commit real secrets)
#   config.toml        ACTIVE file the CLI reads — generated:
#
#   cp supabase/config.local.toml supabase/config.toml   # dev (preferred)
#   cp supabase/config.sample.toml supabase/config.toml  # fresh clone
#   ./scripts/setup.sh supabase                          # does this for you
#
# Values below are safe LOCAL defaults. For production review every
# [auth] section against config.prod.toml and the Dashboard
# (Authentication -> URL Configuration) before go-live.
# ====================================================================

project_id = "supanext"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Caps payload size for accidental/malicious requests.
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# Live subscriptions — client has none today. Flip on when needed.
enabled = false

[studio]
# Dashboard at :54323. Off by default to keep the container set minimal.
enabled = false

# Local email catcher — reset/confirmation emails land in http://localhost:54324
[inbucket]
enabled = true
port = 54324

[storage]
# No upload path in template yet (avatars are plain URLs). Flip on when needed.
enabled = false

[auth]
enabled = true
# PROD: set to your https origin (Dashboard -> URL Configuration).
site_url = "http://127.0.0.1:3000"
# PROD: allow-list exact redirect targets (recovery links, OAuth callbacks).
# Trailing slash matters — static export uses trailingSlash: true.
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# Email-optional startup mode: confirmations OFF so signup works without SMTP.
# Turn ON only after configuring [auth.email.smtp].
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Enable when running with captcha (recommended in no-email mode).
# Pair client-side with NEXT_PUBLIC_TURNSTILE_SITE_KEY.
# Test secret (always passes): 1x0000000000000000000000000000000AA
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(SUPABASE_AUTH_TURNSTILE_SECRET)"

# Required in production once you enable confirmations or password resets.
# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
# supabase/functions/ is scaffold-only. Flip on for edge function dev.
enabled = false

[analytics]
# API logs — heavy (logflare + vector containers). Off for local dev.
enabled = false
